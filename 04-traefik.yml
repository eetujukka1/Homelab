---
- name: Configure Traefik ingress routes
  hosts: k3s_servers[0]
  become: true
  vars:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    portainer_hostname: portainer.homelab.internal
    longhorn_hostname: longhorn.homelab.internal
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  tasks:
    - name: Create Portainer ingress
      shell: |
        kubectl apply -f - <<'EOF'
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: portainer-ingress
          namespace: portainer
        spec:
          rules:
            - host: {{ portainer_hostname }}
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: portainer
                        port:
                          number: 9000
        EOF

    - name: Create Longhorn UI ingress
      shell: |
        kubectl apply -f - <<'EOF'
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: longhorn-ingress
          namespace: longhorn-system
        spec:
          rules:
            - host: {{ longhorn_hostname }}
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: longhorn-frontend
                        port:
                          number: 80
        EOF
