---
- name: Prepare all nodes
  hosts: k3s_cluster
  become: true
  tasks:
    - apt:
        name:
          - curl
          - ca-certificates
          - open-iscsi
          - nfs-common
        state: present
        update_cache: true

    - systemd:
        name: iscsid
        enabled: true
        state: started

- name: Bootstrap first k3s server
  hosts: k3s_servers[0]
  become: true
  vars:
    k3s_version: v1.29.1+k3s1
  tasks:
    - shell: |
        curl -sfL https://get.k3s.io | \
        INSTALL_K3S_VERSION={{ k3s_version }} \
        sh -s - server --cluster-init
      args:
        creates: /etc/rancher/k3s/k3s.yaml

    - slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: token

    - set_fact:
        k3s_token: "{{ token.content | b64decode | trim }}"

- name: Join remaining k3s servers
  hosts: k3s_servers[1:]
  become: true
  vars:
    k3s_version: v1.29.1+k3s1
  tasks:
    - shell: |
        curl -sfL https://get.k3s.io | \
        INSTALL_K3S_VERSION={{ k3s_version }} \
        K3S_TOKEN={{ hostvars[groups['k3s_servers'][0]].k3s_token }} \
        sh -s - server \
        --server https://{{ hostvars[groups['k3s_servers'][0]].ansible_host }}:6443
      args:
        creates: /etc/rancher/k3s/k3s.yaml

- name: Join k3s agents
  hosts: k3s_agents
  become: true
  vars:
    k3s_version: v1.29.1+k3s1
  tasks:
    - shell: |
        curl -sfL https://get.k3s.io | \
        INSTALL_K3S_VERSION={{ k3s_version }} \
        K3S_TOKEN={{ hostvars[groups['k3s_servers'][0]].k3s_token }} \
        sh -s - agent \
        --server https://{{ hostvars[groups['k3s_servers'][0]].ansible_host }}:6443
      args:
        creates: /etc/systemd/system/k3s-agent.service